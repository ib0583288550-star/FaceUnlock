name: Build FaceUnlock

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APKs
        run: gradle --no-daemon :manager:assembleDebug :bridge:assembleDebug

      - name: Publish direct APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes || true
          gh release create nightly \
            --title "FaceUnlock Nightly" \
            --notes "Latest successful debug APKs built from main." \
            --prerelease \
            manager/build/outputs/apk/debug/manager-debug.apk \
            bridge/build/outputs/apk/debug/bridge-debug.apk
